<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="My HQ">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="stylesheet" href="style.css">
<title>My HQ</title>
</head>
<body>
<div id="bg"></div>
<header>
  <button id="back" data-act="back" hidden>‹ Back</button>
  <h1 id="title"></h1>
  <div id="topAction"></div>
</header>
<main id="view"></main>
<button id="fab" data-act="quick" aria-label="Quick add" hidden>＋</button>
<nav id="tabs">
  <button data-act="tab" data-id="today" data-tab="today"><span>🌤️</span>Today</button>
  <button data-act="tab" data-id="calendar" data-tab="calendar"><span>🗓️</span>Calendar</button>
  <button data-act="tab" data-id="list" data-tab="list"><span>📝</span>Lists</button>
  <button data-act="tab" data-id="focus" data-tab="focus"><span>🍅</span>Focus</button>
  <button data-act="tab" data-id="more" data-tab="more"><span>🧸</span>More</button>
</nav>
<div id="modal" hidden></div>
<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
